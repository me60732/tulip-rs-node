[package]
name = "tulip_rs_node"
version = "0.1.0"
edition = "2021"
description = "Node.js native bindings for TulipRS — Technical Analysis Library"
license = "MIT"
authors = ["Mark Ellis <me60732@gmail.com>"]
repository = "https://github.com/me60732/tulip-rs-node"
documentation = "https://me60732.github.io/tulip_rs/"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "2", features = ["napi4"] }
napi-derive = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
bincode     = "1"
tulip_rs    = { git = "https://github.com/me60732/tulip_rs.git", default-features = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = "thin"       # fat LTO (true) adds 3-5x link time with minimal runtime gain for a binding
codegen-units = 4  # default for release is 1; more units = faster compile, tiny perf trade-off
