name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

jobs:
  build:
    name: Build — ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Intel macOS — use macos-13 (x86_64 runner)
          - host: macos-13
            target: x86_64-apple-darwin

          # Apple Silicon — macos-latest is now arm64
          - host: macos-latest
            target: aarch64-apple-darwin

          - host: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}-cargo-ci

      # Authenticate git so Cargo can fetch the tulip_rs git dependency.
      # Falls back to the workflow's built-in GITHUB_TOKEN for public repos;
      # set the GH_PAT secret if tulip_rs is private.
      - name: Configure git credentials for Cargo
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT || github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install npm dependencies
        run: npm ci

      - name: Build native binding
        run: npm run build:native

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: '*.node'
          if-no-files-found: error
          retention-days: 3

  test:
    name: Smoke Test (Linux x64)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: .

      - name: Build TypeScript
        run: npm run build:ts

      - name: Smoke test — SMA
        run: node examples/ti_sma_example.js

      - name: Smoke test — EMA
        run: node examples/ti_ema_example.js

      - name: Smoke test — MACD
        run: node examples/ti_macd_example.js

      - name: Smoke test — BBANDS
        run: node examples/ti_bbands_example.js

      - name: Smoke test — Candlestick
        run: node examples/ti_candlestick_example.js
