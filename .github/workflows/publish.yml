name: Publish to npm

# Triggered by pushing a version tag: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ─── 1. Build native binaries on every target platform ───────────────────────
  build:
    name: Build — ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Both macOS targets run on the Apple Silicon runner.
          # aarch64 builds natively; x86_64 is cross-compiled.
          - host: macos-latest
            target: x86_64-apple-darwin

          - host: macos-latest
            target: aarch64-apple-darwin

          - host: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache Cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}-cargo-publish

      # See CI.yml for explanation of this step.
      - name: Configure git credentials for Cargo
        run: git config --global url."https://x-access-token:${{ secrets.GH_PAT || github.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install npm dependencies
        run: npm ci

      # Pass --target explicitly so napi names the binary correctly and
      # cargo cross-compiles when host != target (x86_64 on Apple Silicon).
      - name: Build native binding
        run: npm run build:native -- --target ${{ matrix.settings.target }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: "*.node"
          if-no-files-found: error
          retention-days: 1

  # ─── 2. Collect artifacts, publish platform packages, then main package ───────
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # Points npm publish at the official registry and injects NODE_AUTH_TOKEN.
          registry-url: "https://registry.npmjs.org"

      - name: Install npm dependencies
        run: npm ci

      # Download all *.node files from every platform into ./artifacts/ (flat).
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      # napi artifacts reads ./artifacts/*.node and creates ./npm/{platform}/
      # directories, each with the binary and a generated package.json.
      - name: Organise artifacts into npm platform packages
        run: npm run artifacts

      - name: List generated npm platform packages
        run: ls -la npm/

      - name: Build TypeScript
        run: npm run build:ts

      # Publish each platform-specific package first, then the main package.
      # The main package's prepublishOnly hook (napi prepublish -t npm) adds
      # optionalDependencies pointing to the platform packages that were just
      # published, so order matters.
      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            echo "Publishing $dir ..."
            npm publish "$dir" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
